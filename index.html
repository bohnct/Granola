<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LDC Basis Tracker</title>
  <meta name="theme-color" content="#000000">
  <script>
    // Apply the saved theme before first paint (see js/theme.js).
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LDC Basis">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <h1 class="sr-only" id="title">LDC Basis Tracker</h1>
    <div id="crop" class="crop" role="tablist" aria-label="Crop"></div>
    <button id="unit-btn" class="icon-btn unit-btn" type="button" aria-label="Units: dollars per tonne">$/MT</button>
    <button id="theme-btn" class="icon-btn" type="button" aria-label="Theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
    <button id="refresh" class="icon-btn" type="button" aria-label="Refresh">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
    </button>
  </header>
  <div id="banner" class="banner" hidden></div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#bids" data-tab="bids">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h12"/></svg><span>Bids</span></a>
    <a href="#history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg><span>History</span></a>
    <a href="#basis" data-tab="basis">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Basis</span></a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
