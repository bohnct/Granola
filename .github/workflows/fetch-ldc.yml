name: Fetch LDC prices

on:
  schedule:
    # Times are UTC (Saskatchewan is UTC-6). GitHub starts scheduled runs late or skips
    # them when it's busy, so these are only wake-up calls: each run stays up and fetches
    # every 15 min until 15:30 Saskatchewan time (see --loop in scripts/fetch_ldc.py).
    # Off the :00/:15 slots, which GitHub drops most.
    - cron: "13,43 12-21 * * 1-5"
    # Evening run to capture the settled prices.
    - cron: "37 23 * * 1-5"
  workflow_dispatch: {}   # adds a "Run workflow" button on GitHub

permissions:
  contents: write

# One run at a time; a later trigger waits and takes over when the running loop ends.
concurrency:
  group: fetch-ldc
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices every 15 min through the trading day
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u scripts/fetch_ldc.py --loop
